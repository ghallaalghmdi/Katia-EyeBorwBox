S.add(box);
let yaw=0.5,pitch=0.15,dist=17,tp=0.15,tyw=0.5,auto=true;
const views={'الأمام':[0,0.0],'الخلف':[Math.PI,0],'الجانب الأيمن':[Math.PI/2,0],'الجانب الأيسر':[-Math.PI/2,0],'الأعلى':[0.4,1.1],'الأسفل':[0.4,-1.1]};
const bar=document.getElementById('bar');
function clr(){document.querySelectorAll('button').forEach(x=>x.classList.remove('on'))}
Object.entries(views).concat([['تدوير تلقائي',null]]).forEach(([n,v])=>{
 const b=document.createElement('button');b.textContent=n;
 b.onclick=()=>{clr();b.classList.add('on');if(v){auto=false;tyw=v[0];tp=v[1]}else{auto=true}};
 bar.appendChild(b);if(!v)b.classList.add('on')});
let pts=new Map(),pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);auto=false;clr()});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);
 if(pts.size==1){tyw+=(e.clientX-p[0])*0.008;tp=Math.max(-1.4,Math.min(1.4,tp+(e.clientY-p[1])*0.008))}
 pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size==2){const a=[...pts.values()];const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd)dist=Math.max(6,Math.min(30,dist*pd/d));pd=d}});
const up=e=>{pts.delete(e.pointerId);pd=0};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(6,Math.min(30,dist*(1+e.deltaY*0.001)))},{passive:false});
function rs(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
function loop(){if(auto)tyw+=0.008;yaw+=(tyw-yaw)*0.12;pitch+=(tp-pitch)*0.12;
 cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(0,0,0);
 R.render(S,cam);requestAnimationFrame(loop)}
loop();
</script></body></html>
